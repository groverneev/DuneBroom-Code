# DuneBroom rover configuration, read by rover/config.py.

[serial]
# "auto" picks the first /dev/serial/by-id/*Arduino* device, else /dev/ttyACM0.
port = "auto"
baud = 115200

[motors]
# Motor driver channel (0-3, printed on the board as M1-M4) of each track, and
# the sign that makes that track drive forward. Measured 2026-11-20:
# left track on M4, right track on M3, positive = forward.
left_channel = 3
right_channel = 2
left_sign = 1
right_sign = 1
# false = open-loop PWM. true = the driver's closed-loop speed mode, which needs
# working encoders: with dead encoders it runs the motors at full power.
# Encoders read nothing as of 2026-11-20, so keep this false until fixed.
closed_loop = false
# PWM duty % (open loop) or driver speed units (closed loop). In open loop,
# ~30% does not move the tracks; 60% moves them slowly.
drive_speed = 70
turn_speed = 70

[calibration]
# Encoder ticks per mm driven and per degree turned.
# 0 means not calibrated yet (drive_mm / turn_deg refuse to run).
# ticks_per_mm: 2026-11-24 on hardwood floor, speed 70: 5002 ticks = 933.5 mm,
# straight; reversing 5010 ticks returned to the start. Recheck on sand.
ticks_per_mm = 5.36
# Turns: ticks = |deg| * ticks_per_degree + turn_offset_ticks.
# Hardwood, speed 70, spin in place (angles by eye), 2026-11-24/25:
# 710 ~ 78 deg, 808 ~ 100, 2790 = 360, 3008 ~ 390, 4 x 810 ~ 450.
# Best fit through zero 7.54; runs scatter about +-10%, so a fixed offset
# isn't supported. Skid turns aren't repeatable enough: plan a gyro.
ticks_per_degree = 7.54
turn_offset_ticks = 0

[camera]
# Logitech C920 PRO, pointing down. by-id path survives USB re-plugging.
device = "/dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_05CD827F-video-index0"
width = 1920
height = 1080
fps = 30
# Auto exposure/focus/white balance run this long, then are frozen.
settle_s = 3.0
# Exposure cap in 100 us units. At drive speed 70 (~280 mm/s) 80 = 8 ms
# = ~2 mm of smear. Indoors auto wants ~330, so frames come out dark/noisy.
exposure_max = 80
# -1 = use the autofocus value at lock time; else 0-250 (C920: 45 at ~floor).
focus = 45    # fixed for the lens calibration (autofocus picked 40-45 at 262 mm)
jpeg_quality = 90

[power]
# Survey guard (rover/power.py): below these a survey won't start, or stops
# and saves. Pi pack %: pipower5 hard-shuts the Pi at 10 %, so stop just
# before (ignored while the charger is plugged in).
pi_min_percent = 12
# Motor pack, 3S Li-ion (12.6 V full, ~9.9 V empty): 10.5 V protects the
# cells. Needs two low readings 5 s apart (voltage sags while driving).
motor_min_mv = 10500

[survey]
# Lane layout (rover/survey.py). The rover starts at the plot's near-left
# corner (or near-right with side = "left"), facing along the plot, placed so
# the camera's view sits just inside the corner.
side = "right"            # which way the next lanes are, seen from the start
side_overlap = 0.2        # fraction of the view width shared by neighbouring lanes
# Ground seen by one frame, across and along the direction of travel.
# camera_calibration.json replaces these once the camera is calibrated
# (`across` = its footprint width if the image's long side is across).
footprint_across_mm = 370   # rough, from the aim check at ~262 mm height
footprint_along_mm = 210
camera_across = "width"   # which image side is across the lane: width / height
# How far the view's centre is ahead of the rover's turning centre. Turning
# 180 deg moves the view by twice this, so lane ends drive it back. MEASURE.
camera_ahead_mm = 0
speed = 70                # PWM %; ~280 mm/s at 70 on hardwood
segment_mm = 500          # lanes are driven in pieces, re-squared to the heading between
save_fps = 5
